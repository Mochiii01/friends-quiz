<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Well Do Your Friends Know You?</title>

<style>
body{
  font-family: Arial;
  text-align:center;
  background:#f0f8ff;
}

.quiz-container{
  background:white;
  width:400px;
  margin:30px auto;
  padding:20px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input{
  padding:10px;
  width:80%;
  font-size:16px;
}

button{
  margin:10px;
  padding:12px 20px;
  font-size:16px;
  border:none;
  border-radius:5px;
  background:#4CAF50;
  color:white;
  cursor:pointer;
}

#score-display{
  font-size:22px;
  font-weight:bold;
}
</style>

</head>

<body>

<h1>How Well Do Your Friends Know You?</h1>

<div class="quiz-container" id="container">

<input type="text" id="playerName" placeholder="Enter your name"><br>

<button onclick="startQuiz()">Start Quiz</button>

</div>

<script>

const quizData = [

{question:"What is my favorite color?",choices:["Red","Blue","Green","Yellow"],answer:"Blue"},

{question:"Do I like waking up early?",choices:["Yes","No"],answer:"Yes"},

{question:"Do I like drinking milk?",choices:["Yes","No"],answer:"Yes"},

{question:"Do I like exercising?",choices:["Yes","No"],answer:"No"},

{question:"Do I like sweets?",choices:["Yes","No"],answer:"Yes"},

{question:"Do I prefer cats or dogs?",choices:["Cats","Dogs"],answer:"Dogs"},

{question:"How much do I usually use my phone?",choices:["A lot","Moderate","Very little"],answer:"Moderate"},

{question:"Do I prefer being alone or in a crowd?",choices:["Alone","In a crowd"],answer:"Alone"},

{question:"What is my favorite fruit?",choices:["Apple","Banana","Orange","Grapes"],answer:"Apple"},

{question:"Do I like coffee?",choices:["Yes","No"],answer:"No"}

];

let currentQuestion = 0;
let score = 0;
let playerName = "";

function startQuiz(){

const name = document.getElementById("playerName").value;

if(name===""){
alert("Please enter your name");
return;
}

playerName = name;
score = 0;
currentQuestion = 0;

showQuestion();

}

function showQuestion(){

const q = quizData[currentQuestion];

const container = document.getElementById("container");

container.innerHTML = "<h2>"+q.question+"</h2>";

q.choices.forEach(choice=>{

let btn = document.createElement("button");

btn.innerText = choice;

btn.onclick = function(){

if(choice===q.answer){

score++;

}

nextQuestion();

}

container.appendChild(btn);

});

}

function nextQuestion(){

currentQuestion++;

if(currentQuestion<quizData.length){

showQuestion();

}else{

showResult();

}

}

function showResult(){

const container = document.getElementById("container");

container.innerHTML = "<h2>Quiz Finished!</h2>";

container.innerHTML += "<p id='score-display'>"+playerName+" scored "+score+" / "+quizData.length+"</p>";

let restart = document.createElement("button");

restart.innerText="Play Again";

restart.onclick=function(){

location.reload();

}

container.appendChild(restart);

}

</script>

</body>
</html>
